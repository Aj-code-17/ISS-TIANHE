<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ISS & Tiangong Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      height: 100vh; 
      overflow: hidden; 
      font-family: Arial, sans-serif; 
      background: #000; 
      color: #fff; 
    }
    #map { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; 
      height: 100%; 
    }
    .marker { 
      background-size: cover; 
      width: 52px; 
      height: 52px; 
      transform: translate(-50%, -50%); 
      cursor: pointer; 
    }
    .marker:hover::after {
      content: attr(data-name);
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 14px;
      white-space: nowrap;
      z-index: 100;
    }

    /* Draggable Popup */
    #station-popup {
      position: absolute;
      top: 120px;
      left: 120px;
      background: rgba(0,0,0,0.95);
      color: white;
      padding: 20px;
      border-radius: 12px;
      width: 340px;
      display: none;
      z-index: 3000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 1px solid #666;
      cursor: move;
    }
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }
    .popup-close {
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }
    .popup-close:hover { color: #ff6666; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Draggable Popup -->
  <div id="station-popup">
    <div class="popup-header">
      <h3 id="popup-title"></h3>
      <span class="popup-close" onclick="document.getElementById('station-popup').style.display='none'">×</span>
    </div>
    <div id="popup-content" style="line-height:1.6;"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@4.0.0/dist/satellite.min.js"></script>
  <script>
    // === YOUR EXACT TLEs ===
    const TLE = {
      ISS: {
        line1: '1 25544U 98067A   26115.16771349  .00010683  00000-0  20209-3 0  9997',
        line2: '2 25544  51.6320 202.5215 0006921 348.0684  12.0139 15.48944607563533'
      },
      TIANGONG: {
        line1: '1 48274U 21035A 26114.82012301 .00024940 00000+0 27063-3 0 9996',
        line2: '2 48274 41.4671 287.0016 0006791 267.9229 92.0833 15.62898540284821'
      }
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'satellite-tiles': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256
          }
        },
        layers: [{ id: 'background', type: 'raster', source: 'satellite-tiles' }]
      },
      center: [0, 0],
      zoom: 1.8,
      interactive: false,
      renderWorldCopies: true
    });

    function createMarker(iconUrl, name) {
      const el = document.createElement('div');
      el.className = 'marker';
      el.style.backgroundImage = `url(${iconUrl})`;
      el.dataset.name = name;
      return el;
    }

    const issMarker = new maplibregl.Marker({ element: createMarker('iss.png', 'ISS') }).setLngLat([0,0]).addTo(map);
    const tiangongMarker = new maplibregl.Marker({ element: createMarker('tiangong.png', 'Tiangong') }).setLngLat([0,0]).addTo(map);

    // Draggable Popup
    function makeDraggable(popup) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      const header = popup.querySelector('.popup-header');

      header.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        popup.style.top = (popup.offsetTop - pos2) + "px";
        popup.style.left = (popup.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    function showPopup(title, html) {
      const popup = document.getElementById('station-popup');
      document.getElementById('popup-title').textContent = title;
      document.getElementById('popup-content').innerHTML = html;
      popup.style.display = 'block';
      if (!popup.dataset.draggable) {
        makeDraggable(popup);
        popup.dataset.draggable = 'true';
      }
    }

    issMarker.getElement().addEventListener('click', () => showISSInfo());
    tiangongMarker.getElement().addEventListener('click', () => showTiangongInfo());

    function showISSInfo() {
      showPopup('International Space Station (ISS)', `
        <p><strong>Latitude:</strong> <span id="live-iss-lat">—</span></p>
        <p><strong>Longitude:</strong> <span id="live-iss-lon">—</span></p>
        <p><strong>Speed:</strong> <span id="live-iss-speed">—</span> km/h</p>
        <p><strong>Altitude:</strong> <span id="live-iss-alt">—</span> km</p>
      `);
    }

    function showTiangongInfo() {
      showPopup('Tiangong Space Station', `
        <p><strong>Latitude:</strong> <span id="live-tg-lat">—</span></p>
        <p><strong>Longitude:</strong> <span id="live-tg-lon">—</span></p>
        <p><strong>Speed:</strong> <span id="live-tg-speed">—</span> km/h</p>
        <p><strong>Altitude:</strong> <span id="live-tg-alt">—</span> km</p>
      `);
    }

    // Satellite position
    function normalizeLng(lng) {
      return ((lng + 180) % 360 + 360) % 360 - 180;
    }

    function getSatellitePosition(tle1, tle2, date) {
      try {
        const satrec = satellite.twoline2satrec(tle1, tle2);
        const pv = satellite.propagate(satrec, date);
        if (!pv.position) return null;
        const gd = satellite.eciToGeodetic(pv.position, satellite.gstime(date));
        return {
          lng: normalizeLng(satellite.degreesLong(gd.longitude)),
          lat: satellite.degreesLat(gd.latitude)
        };
      } catch (e) { return null; }
    }

    // Proper wrapping for future path (fixes straight lines)
    function splitForAntimeridian(coords) {
      if (!coords.length) return [];
      const segments = [];
      let current = [coords[0]];
      for (let i = 1; i < coords.length; i++) {
        const prev = coords[i-1];
        const cur = coords[i];
        if (Math.abs(cur[0] - prev[0]) > 180) {
          const boundary = prev[0] > 0 ? 180 : -180;
          const t = (boundary - prev[0]) / (cur[0] - prev[0] + (cur[0] > prev[0] ? -360 : 360));
          const interLat = prev[1] + t * (cur[1] - prev[1]);
          current.push([boundary, interLat]);
          segments.push(current);
          current = [[-boundary, interLat], cur];
        } else {
          current.push(cur);
        }
      }
      segments.push(current);
      return segments;
    }

    function drawWrappedOrbit(tle1, tle2, color, idBase) {
      const coords = [];
      const now = new Date();
      for (let i = 0; i <= 90; i++) {
        const t = new Date(now.getTime() + i * 60 * 1000);
        const pos = getSatellitePosition(tle1, tle2, t);
        if (pos) coords.push([pos.lng, pos.lat]);
      }

      for (let i = 0; i < 8; i++) {
        const sid = `${idBase}_${i}`;
        if (map.getLayer(sid)) map.removeLayer(sid);
        if (map.getSource(sid)) map.removeSource(sid);
      }

      const segments = splitForAntimeridian(coords);
      segments.forEach((seg, idx) => {
        const sid = `${idBase}_${idx}`;
        map.addSource(sid, {
          type: 'geojson',
          data: { type: 'Feature', geometry: { type: 'LineString', coordinates: seg }}
        });
        map.addLayer({
          id: sid,
          type: 'line',
          source: sid,
          paint: { 'line-color': color, 'line-width': 3.5, 'line-opacity': 0.9 }
        });
      });
    }

    // Live updates
    async function updateISS() {
      try {
        const resp = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
        const d = await resp.json();
        issMarker.setLngLat([d.longitude, d.latitude]);
      } catch (e) { console.error(e); }
    }

    function updateTiangong() {
      const pos = getSatellitePosition(TLE.TIANGONG.line1, TLE.TIANGONG.line2, new Date());
      if (pos) {
        tiangongMarker.setLngLat([pos.lng, pos.lat]);
      }
    }

    map.on('load', () => {
      drawWrappedOrbit(TLE.ISS.line1, TLE.ISS.line2, '#ff4444', 'iss-orbit');
      drawWrappedOrbit(TLE.TIANGONG.line1, TLE.TIANGONG.line2, '#4488ff', 'tiangong-orbit');

      updateISS();
      updateTiangong();

      setInterval(updateISS, 5000);
      setInterval(updateTiangong, 2000);

      setInterval(() => {
        drawWrappedOrbit(TLE.ISS.line1, TLE.ISS.line2, '#ff4444', 'iss-orbit');
        drawWrappedOrbit(TLE.TIANGONG.line1, TLE.TIANGONG.line2, '#4488ff', 'tiangong-orbit');
      }, 90000);
    });
  </script>
</body>
</html>
