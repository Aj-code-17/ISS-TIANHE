<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ISS & Tiangong Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" />
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      height: 100vh; 
      overflow: hidden; 
      font-family: Arial, sans-serif; 
      background: #000; 
      color: #fff; 
    }
    #map { height: 100vh; width: 100%; }
    .marker { 
      background-size: cover; 
      width: 48px; 
      height: 48px; 
      transform: translate(-50%, -50%); 
      cursor: pointer; 
    }
    #station-popup {
      position: absolute;
      top: 50%;
      right: 30px;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.92);
      color: white;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      display: none;
      z-index: 1000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      max-height: 80vh;
      overflow-y: auto;
    }
    .popup-close {
      float: right;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Click Popup (middle-right) -->
  <div id="station-popup">
    <span class="popup-close" onclick="document.getElementById('station-popup').style.display='none'">×</span>
    <h3 id="popup-title"></h3>
    <div id="popup-content" style="line-height:1.6;"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@4.0.0/dist/satellite.min.js"></script>
  <script>
    // Fresh TLEs (April 2026)
    const TLE = {
      ISS: {
        line1: '1 25544U 98067A   26115.16771349  .00010683  00000-0  20209-3 0  9997',
        line2: '2 25544  51.6320 202.5215 0006921 348.0684  12.0139 15.48944607563533'
      },
      TIANGONG: {
        line1: '1 48274U 21035A   26114.82012301  .00024940  00000+0  27063-3 0  9996',
        line2: '2 48274  41.4671 287.0016 0006791 267.9229  92.0833 15.62898540284821'
      }
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'satellite-tiles': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256
          }
        },
        layers: [{ id: 'background', type: 'raster', source: 'satellite-tiles' }]
      },
      center: [0, 0],
      zoom: 1.8,
      interactive: false,        // Map is completely locked
      renderWorldCopies: true
    });

    function createMarker(iconUrl, name) {
      const el = document.createElement('div');
      el.className = 'marker';
      el.style.backgroundImage = `url(${iconUrl})`;
      el.title = name;   // Hover shows name
      return el;
    }

    const issMarker = new maplibregl.Marker({ element: createMarker('iss.png', 'ISS') }).setLngLat([0,0]).addTo(map);
    const tiangongMarker = new maplibregl.Marker({ element: createMarker('tiangong.png', 'Tiangong') }).setLngLat([0,0]).addTo(map);

    // Popup on right
    function showPopup(title, html) {
      document.getElementById('popup-title').innerHTML = title;
      document.getElementById('popup-content').innerHTML = html;
      document.getElementById('station-popup').style.display = 'block';
    }

    issMarker.getElement().addEventListener('click', () => {
      showPopup('International Space Station (ISS)', `
        <p><strong>Live Position:</strong></p>
        <p>Lat: <span id="p-iss-lat"></span></p>
        <p>Lon: <span id="p-iss-lon"></span></p>
        <p>Speed: <span id="p-iss-speed"></span> km/h</p>
        <p>Altitude: <span id="p-iss-alt"></span> km</p>
      `);
      // You can enhance with real values later
    });

    tiangongMarker.getElement().addEventListener('click', () => {
      showPopup('Tiangong Space Station', `
        <p><strong>Live Position:</strong></p>
        <p>Lat: <span id="p-tg-lat"></span></p>
        <p>Lon: <span id="p-tg-lon"></span></p>
        <p>Speed: <span id="p-tg-speed"></span> km/h</p>
        <p>Altitude: <span id="p-tg-alt"></span> km</p>
      `);
    });

    // Utilities
    function normalizeLng(lng) {
      return ((lng + 180) % 360 + 360) % 360 - 180;
    }

    function getSatellitePosition(tle1, tle2, date) {
      try {
        const satrec = satellite.twoline2satrec(tle1, tle2);
        const pv = satellite.propagate(satrec, date);
        if (!pv.position) return null;
        const gd = satellite.eciToGeodetic(pv.position, satellite.gstime(date));
        return {
          lng: normalizeLng(satellite.degreesLong(gd.longitude)),
          lat: satellite.degreesLat(gd.latitude)
        };
      } catch(e) { return null; }
    }

    // Proper wrapped orbit drawing (fixes straight lines)
    function splitForAntimeridian(coords) {
      if (!coords.length) return [];
      const segments = [];
      let current = [coords[0]];
      for (let i = 1; i < coords.length; i++) {
        const prev = coords[i-1];
        const cur = coords[i];
        if (Math.abs(cur[0] - prev[0]) > 180) {
          const boundary = prev[0] > 0 ? 180 : -180;
          const t = (boundary - prev[0]) / (cur[0] - prev[0] + (cur[0] > prev[0] ? -360 : 360));
          const interLat = prev[1] + t * (cur[1] - prev[1]);
          current.push([boundary, interLat]);
          segments.push(current);
          current = [[-boundary, interLat], cur];
        } else {
          current.push(cur);
        }
      }
      segments.push(current);
      return segments;
    }

    function drawWrappedOrbit(tle1, tle2, color, idBase) {
      const coords = [];
      const now = new Date();
      for (let i = 0; i <= 90; i++) {
        const t = new Date(now.getTime() + i * 60 * 1000);
        const pos = getSatellitePosition(tle1, tle2, t);
        if (pos) coords.push([pos.lng, pos.lat]);
      }

      // Clean old layers
      for (let i = 0; i < 8; i++) {
        const sid = `${idBase}_${i}`;
        if (map.getLayer(sid)) map.removeLayer(sid);
        if (map.getSource(sid)) map.removeSource(sid);
      }

      const segments = splitForAntimeridian(coords);
      segments.forEach((seg, idx) => {
        const sid = `${idBase}_${idx}`;
        map.addSource(sid, {
          type: 'geojson',
          data: { type: 'Feature', geometry: { type: 'LineString', coordinates: seg }}
        });
        map.addLayer({
          id: sid,
          type: 'line',
          source: sid,
          paint: {
            'line-color': color,
            'line-width': 3,
            'line-opacity': 0.85
          }
        });
      });
    }

    // Live marker updates
    async function updateISS() {
      try {
        const resp = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
        const d = await resp.json();
        issMarker.setLngLat([d.longitude, d.latitude]);
      } catch(e) { console.error(e); }
    }

    function updateTiangong() {
      const pos = getSatellitePosition(TLE.TIANGONG.line1, TLE.TIANGONG.line2, new Date());
      if (pos) tiangongMarker.setLngLat([pos.lng, pos.lat]);
    }

    // Initialize
    map.on('load', () => {
      drawWrappedOrbit(TLE.ISS.line1, TLE.ISS.line2, '#ff4444', 'iss-orbit');
      drawWrappedOrbit(TLE.TIANGONG.line1, TLE.TIANGONG.line2, '#4488ff', 'tiangong-orbit');

      updateISS();
      updateTiangong();

      setInterval(updateISS, 5000);
      setInterval(updateTiangong, 2000);
      setInterval(() => {
        drawWrappedOrbit(TLE.ISS.line1, TLE.ISS.line2, '#ff4444', 'iss-orbit');
        drawWrappedOrbit(TLE.TIANGONG.line1, TLE.TIANGONG.line2, '#4488ff', 'tiangong-orbit');
      }, 60000);
    });
  </script>
</body>
</html>
