<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ISS & Tiangong Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" />
  <style>
    body { margin: 0; padding: 0; height: auto; font-family: Arial, sans-serif; background: #000; color: #fff; }
    #map { height: 65vh; width: 100%; }
    .marker { background-size: cover; width: 44px; height: 44px; transform: translate(-50%, -50%); cursor: pointer; }
    .info-section { padding: 20px; background: #1a1a1a; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .orbital-data { background: #ffba81; color: #000; padding: 15px; border-radius: 8px; min-width: 280px; }
    #station-popup {
      position: absolute; top: 50%; right: 30px; transform: translateY(-50%);
      background: rgba(0,0,0,0.9); color: white; padding: 18px; border-radius: 10px;
      width: 300px; display: none; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }
    .popup-close { float: right; font-size: 24px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="info-section">
    <div class="orbital-data">
      <h4>ISS Orbital Data</h4>
      <p>Time (UTC+5): <span id="iss-time"></span></p>
      <p>Speed: <span id="iss-speed"></span> km/h</p>
      <p>Altitude: <span id="iss-altitude"></span> km</p>
      <p>Lat: <span id="iss-lat"></span></p>
      <p>Lon: <span id="iss-lon"></span></p>
      <p>Distance: <span id="iss-distance"></span> km</p>
    </div>
    <div class="orbital-data">
      <h4>Tiangong Orbital Data</h4>
      <p>Time (UTC+5): <span id="tg-time"></span></p>
      <p>Speed: <span id="tg-speed"></span> km/h</p>
      <p>Altitude: <span id="tg-altitude"></span> km</p>
      <p>Lat: <span id="tg-lat"></span></p>
      <p>Lon: <span id="tg-lon"></span></p>
      <p>Distance: <span id="tg-distance"></span> km</p>
    </div>
  </div>

  <!-- Click Popup -->
  <div id="station-popup">
    <span class="popup-close" onclick="document.getElementById('station-popup').style.display='none'">×</span>
    <h3 id="popup-title"></h3>
    <div id="popup-content"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@4.0.0/dist/satellite.min.js"></script>
  <script>
    // Fresh TLEs (April 2026)
    const TLE = {
      ISS: {
        line1: '1 25544U 98067A   26115.16771349  .00010683  00000-0  20209-3 0  9997',
        line2: '2 25544  51.6320 202.5215 0006921 348.0684  12.0139 15.48944607563533'
      },
      TIANGONG: {
        line1: '1 48274U 21035A   26114.82012301  .00024940  00000+0  27063-3 0  9996',
        line2: '2 48274  41.4671 287.0016 0006791 267.9229  92.0833 15.62898540284821'
      }
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'satellite-tiles': { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256 }
        },
        layers: [{ id: 'background', type: 'raster', source: 'satellite-tiles' }]
      },
      center: [0, 0],
      zoom: 1.8,
      interactive: false,   // Map is locked
      renderWorldCopies: true
    });

    function createMarker(iconUrl, name) {
      const el = document.createElement('div');
      el.className = 'marker';
      el.style.backgroundImage = `url(${iconUrl})`;
      el.title = name;   // Hover shows name
      return el;
    }

    const issMarker = new maplibregl.Marker({ element: createMarker('iss.png', 'ISS') }).setLngLat([0,0]).addTo(map);
    const tiangongMarker = new maplibregl.Marker({ element: createMarker('tiangong.png', 'Tiangong') }).setLngLat([0,0]).addTo(map);

    // Click to show popup on right
    function showPopup(title, html) {
      document.getElementById('popup-title').innerHTML = title;
      document.getElementById('popup-content').innerHTML = html;
      document.getElementById('station-popup').style.display = 'block';
    }

    issMarker.getElement().addEventListener('click', () => showPopup('ISS', 'Loading live data...'));
    tiangongMarker.getElement().addEventListener('click', () => showPopup('Tiangong', 'Loading live data...'));

    // Utility functions
    function normalizeLng(lng) { return ((lng + 180) % 360 + 360) % 360 - 180; }

    function getSatellitePosition(tle1, tle2, date) {
      try {
        const satrec = satellite.twoline2satrec(tle1, tle2);
        const pv = satellite.propagate(satrec, date);
        if (!pv.position) return null;
        const gd = satellite.eciToGeodetic(pv.position, satellite.gstime(date));
        return {
          lng: normalizeLng(satellite.degreesLong(gd.longitude)),
          lat: satellite.degreesLat(gd.latitude),
          alt: Math.round(gd.height),
          vel: Math.round(Math.sqrt(pv.velocity.x**2 + pv.velocity.y**2 + pv.velocity.z**2) * 3600)
        };
      } catch(e) { return null; }
    }

    // Simple orbit drawing (solid lines)
    function drawOrbit(tle1, tle2, color, id) {
      const coords = [];
      const now = new Date();
      for (let i = 0; i <= 90; i++) {
        const t = new Date(now.getTime() + i*60*1000);
        const p = getSatellitePosition(tle1, tle2, t);
        if (p) coords.push([p.lng, p.lat]);
      }
      // Remove old
      if (map.getSource(id)) map.removeSource(id);
      if (map.getLayer(id)) map.removeLayer(id);

      map.addSource(id, { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
      map.addLayer({ id: id, type: 'line', source: id, paint: { 'line-color': color, 'line-width': 3 } });
    }

    // Live updates
    async function updateISS() {
      try {
        const res = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
        const d = await res.json();
        issMarker.setLngLat([d.longitude, d.latitude]);

        // Update panel
        document.getElementById('iss-lat').textContent = d.latitude.toFixed(2) + '°';
        document.getElementById('iss-lon').textContent = d.longitude.toFixed(2) + '°';
        document.getElementById('iss-altitude').textContent = d.altitude.toFixed(1);
        document.getElementById('iss-speed').textContent = d.velocity.toFixed(0);
      } catch(e) { console.error(e); }
    }

    function updateTiangong() {
      const pos = getSatellitePosition(TLE.TIANGONG.line1, TLE.TIANGONG.line2, new Date());
      if (pos) {
        tiangongMarker.setLngLat([pos.lng, pos.lat]);
        document.getElementById('tg-lat').textContent = pos.lat.toFixed(2) + '°';
        document.getElementById('tg-lon').textContent = pos.lng.toFixed(2) + '°';
        document.getElementById('tg-altitude').textContent = pos.alt;
        document.getElementById('tg-speed').textContent = pos.vel;
      }
    }

    map.on('load', () => {
      drawOrbit(TLE.ISS.line1, TLE.ISS.line2, '#ff4444', 'iss-orbit');
      drawOrbit(TLE.TIANGONG.line1, TLE.TIANGONG.line2, '#4488ff', 'tiangong-orbit');

      updateISS();
      updateTiangong();

      setInterval(updateISS, 5000);
      setInterval(updateTiangong, 2000);
      setInterval(() => {
        drawOrbit(TLE.ISS.line1, TLE.ISS.line2, '#ff4444', 'iss-orbit');
        drawOrbit(TLE.TIANGONG.line1, TLE.TIANGONG.line2, '#4488ff', 'tiangong-orbit');
      }, 90000);
    });
  </script>
</body>
</html>
